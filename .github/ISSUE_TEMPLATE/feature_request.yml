name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How it should work, ideally with how a well-known app does it.
