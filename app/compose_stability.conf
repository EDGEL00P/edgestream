// Types from outside this module that the Compose compiler can't infer as stable.
// Listing them lets composables taking these parameters skip recomposition.

// java.time values are immutable.
java.time.*
java.time.format.DateTimeFormatter

// Uri is immutable once built.
android.net.Uri

// Read-only collections: EdgeStream never mutates a list after handing it to the UI
// (state updates always copy), so treat them as stable.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
